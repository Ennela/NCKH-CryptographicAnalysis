name: Continuous Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires lowercase image names, but github.repository may contain uppercase
      - name: Lowercase image namespace
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Ingestion Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ingestion/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/ingestion:latest
            ghcr.io/${{ steps.repo.outputs.name }}/ingestion:${{ github.sha }}

      - name: Build and Push Training Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/training/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/training:latest
            ghcr.io/${{ steps.repo.outputs.name }}/training:${{ github.sha }}

      - name: Build and Push Inference Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/inference/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/inference:latest
            ghcr.io/${{ steps.repo.outputs.name }}/inference:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          target: prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/frontend:latest
            ghcr.io/${{ steps.repo.outputs.name }}/frontend:${{ github.sha }}

  # ----------------------------------------------------------------------------
  # OPTIONAL: Deploy to a production VM via SSH.
  # Uncomment this job ONLY after adding the following repository secrets:
  #   - PROD_HOST      : server address
  #   - PROD_USER      : ssh user
  #   - PROD_SSH_KEY   : private ssh key
